name: seo-audit
on:
  workflow_dispatch:
  push:
    branches: [ci/seo-audit]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install
        run: |
          corepack enable || true
          if [ -f pnpm-lock.yaml ]; then
            corepack prepare pnpm@latest --activate || npm i -g pnpm
            pnpm install --no-frozen-lockfile --config.dangerouslyAllowAllBuilds=true \
              || pnpm install --no-frozen-lockfile
          elif [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi
      - name: build
        run: npm run build --if-present || npx astro build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 定位构建产物
        run: |
          # Vercel 适配器把产物放在 .vercel/output/static，不是 dist/；
          # 审计脚本按目录打分找 web root，不会进隐藏目录。
          if [ ! -d dist ] && [ -d .vercel/output/static ]; then
            cp -r .vercel/output/static dist
          fi
          echo "--- 产物目录 ---"
          for d in dist build out .vercel/output/static; do
            [ -d "$d" ] && echo "$d: $(find "$d" -name '*.html' | wc -l) html"
          done
      - name: audit
        run: |
          python3 -I .seo-audit/audit.py . .seo-audit/result.json
          echo '===== RESULT JSON ====='
          cat .seo-audit/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-audit-result
          path: .seo-audit/result.json
