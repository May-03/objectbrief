name: seo-audit
on:
  workflow_dispatch:
  push:
    branches: [ci/seo-audit]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install
        run: |
          corepack enable || true
          if [ -f pnpm-lock.yaml ]; then
            corepack prepare pnpm@latest --activate || npm i -g pnpm
            pnpm install --no-frozen-lockfile --config.dangerouslyAllowAllBuilds=true \
              || pnpm install --no-frozen-lockfile
          elif [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi
      - name: build
        run: npm run build --if-present || npx astro build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 定位构建产物
        run: |
          # Vercel 适配器会同时留下 dist/（client+server 的中间产物）和
          # .vercel/output/static（真正部署的那份）。上一版只在 dist 不存在
          # 时才拷贝，结果审计看的是 dist/client——它没有顶层 index.html
          # （首页是 SSR），于是 web root 被判成了某篇文章的叶子目录，
          # 174 页只审了 1 页。这里让 static 无条件覆盖。
          if [ -d .vercel/output/static ]; then
            rm -rf dist && cp -r .vercel/output/static dist
          fi
          echo "--- 产物目录 ---"
          for d in dist build out .vercel/output/static; do
            [ -d "$d" ] && echo "$d: $(find "$d" -name '*.html' | wc -l) html"
          done
          echo "--- dist 顶层 ---"
          ls dist 2>/dev/null | head -12
      - name: audit
        run: |
          python3 -I .seo-audit/audit.py . .seo-audit/result.json
          echo '===== RESULT JSON ====='
          cat .seo-audit/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-audit-result
          path: .seo-audit/result.json
      - name: content-audit
        run: |
          python3 -I .seo-audit/content.py dist .seo-audit/content.json --name "$GITHUB_REPOSITORY"
          echo '===== CONTENT JSON ====='
          cat .seo-audit/content.json
